<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; background: #f5f0eb; margin: 0; padding: 40px 20px;">
    <div style="max-width: 560px; margin: 0 auto; background: white; border-radius: 16px; overflow: hidden;">
        <div style="background: linear-gradient(135deg, #0f2b26, #1a4a40); padding: 32px 40px; text-align: center;">
            <h1 style="color: white; margin: 0; font-size: 22px;">
                Explore <span style="color: #c8925e;">Kimberley</span>
            </h1>
        </div>
        <div style="padding: 40px;">
            <h2 style="color: #0f2b26; margin-bottom: 16px;">Hello, {{ user_name }}.</h2>
            <p style="color: #4a5a58; line-height: 1.6; margin-bottom: 16px;">
                Your account on <strong>Explore Kimberley</strong> has been suspended.
            </p>
            <p style="color: #4a5a58; line-height: 1.6; margin-bottom: 24px;">
                <strong>Reason:</strong> {{ reason }}
            </p>
            <p style="color: #4a5a58; line-height: 1.6; margin-bottom: 24px;">
                If you believe this was a mistake, or you would like to appeal this decision, please contact us at
                <a href="mailto:explorekimberley@gmail.com" style="color: #c8925e;">explorekimberley@gmail.com</a>.
            </p>
        </div>
        <div style="background: #faf8f6; padding: 20px 40px; text-align: center; font-size: 12px; color: #8a9a98;">
            &copy; 2026 Explore Kimberley · Tourism Platform
        </div>
    </div>
</body>
</html>
