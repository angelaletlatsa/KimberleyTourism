{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete | Explore Kimberley</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Inter', Arial, sans-serif; background: #f7f4ef; color: #1f3d3a; }
        .navbar { height: 68px; background: #1f3d3a; display: flex; align-items: center; justify-content: space-between; padding: 0 6%; }
        .navbar-brand { color: white; text-decoration: none; font-size: 21px; font-weight: 700; letter-spacing: -0.5px; }
        .navbar-brand span { color: #d69b5b; }

        .main-wrap { min-height: calc(100vh - 68px); display: flex; align-items: center; justify-content: center; padding: 30px 6%; }
        .card { width: 100%; max-width: 520px; background: white; border-radius: 18px; padding: 56px 48px; text-align: center; box-shadow: 0 15px 45px rgba(31,61,58,0.12); }

        .success-icon {
            width: 88px; height: 88px; border-radius: 50%;
            background: linear-gradient(135deg, #e6f4ee, #d0ebdf);
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; color: #2d8f6f; margin: 0 auto 24px;
        }

        h1 { color: #0f2b26; margin: 0 0 12px; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
        .subtitle { color: #7b8583; margin: 0 0 32px; font-size: 14px; line-height: 1.7; }

        .btn {
            display: inline-block; padding: 14px 32px; border-radius: 10px;
            background: #c7854c; color: white; text-decoration: none;
            font-size: 14px; font-weight: 600; transition: 0.2s;
            box-shadow: 0 6px 18px rgba(199,133,76,0.25);
        }
        .btn:hover { background: #b87642; }

        @media (max-width: 600px) {
            .card { padding: 40px 28px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="navbar-brand">Explore <span>Kimberley</span></a>
    </nav>

    <main class="main-wrap">
        <div class="card">

            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>

            <h1>Password reset successfully</h1>
            <p class="subtitle">
                Your password has been changed. You can now sign in to your account with your new password.
            </p>

            <a href="/accounts/login/" class="btn">
                <i class="fas fa-right-to-bracket" style="margin-right:6px;"></i>
                Sign In Now
            </a>

        </div>
    </main>

</body>
</html>
